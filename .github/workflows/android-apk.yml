name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}   # allows manual "Run workflow" button in GitHub UI

jobs:
  build-android:
    runs-on: ubuntu-latest   # Linux runner: no Windows path-length / drive-letter issues

    env:
      NODE_ENV: production
      # These come from repo Settings > Secrets and variables > Actions > New repository secret.
      # Add each one there with the exact same name used in your .env / .env.local file.
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_SOCKET_URL: ${{ secrets.EXPO_PUBLIC_SOCKET_URL }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (matches project's ndk version)
        run: sdkmanager --install "ndk;27.1.12297006"

      - name: Install dependencies (clean, reproducible)
        run: npm ci

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # If android/ is NOT committed to your repo and you rely on Expo
      # to generate it, uncomment the next step. If android/ IS committed
      # (as it seems to be, since you're running gradlew locally), skip it.
      # - name: Prebuild native Android project
      #   run: npx expo prebuild --platform android --clean

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
