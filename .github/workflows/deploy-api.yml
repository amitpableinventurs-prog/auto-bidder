name: API CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'

jobs:
  build:
    name: Build & typecheck API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@autobidder/api

      - run: npm run build:api

  deploy:
    name: Deploy to production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /var/www/auto-bidder
            git fetch origin main
            git reset --hard origin/main
            npm ci
            npm run prisma:generate --workspace=@autobidder/api
            npx prisma migrate deploy --schema services/api/prisma/schema.prisma
            npm run build:api
            pm2 reload ecosystem.config.js --update-env
            pm2 status
