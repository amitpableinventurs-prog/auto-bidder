name: Build Auto Bidder Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NODE_OPTIONS: --max-old-space-size=8192
      GRADLE_OPTS: >-
        -Xmx6g
        -XX:MaxMetaspaceSize=1g
        -Dfile.encoding=UTF-8
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Show environment
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Java:"
          java -version

          echo "Memory:"
          free -h

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo dependencies
        run: |
          npx expo install --check
          npm ls expo-image-manipulator
          npm ls react-native-reanimated
          npm ls react-native-worklets

      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          echo "Android project OK"

      - name: Configure Gradle memory
        working-directory: android
        run: |
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          echo "org.gradle.caching=true" >> gradle.properties

      - name: Clean Android build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean --no-daemon --max-workers=2

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      - name: Verify APK
        run: |
          echo "Checking APK..."

          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find android/app/build/outputs/apk/release -type f -name '*.apk' -print -quit)"

          echo "APK BUILD SUCCESSFUL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-bidder-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
