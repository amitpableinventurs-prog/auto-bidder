name: Android APK Build + Crash Test

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build-and-crash-test:


runs-on: ubuntu-latest

timeout-minutes: 60

steps:

  # ============================================================
  # 1. CHECKOUT
  # ============================================================

  - name: Checkout repository
    uses: actions/checkout@v4


  # ============================================================
  # 2. NODE
  # ============================================================

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm


  # ============================================================
  # 3. INSTALL JAVASCRIPT DEPENDENCIES
  # ============================================================

  - name: Install dependencies
    run: npm ci


  # ============================================================
  # 4. EXPO DOCTOR
  # ============================================================

  - name: Run Expo Doctor
    run: npx expo-doctor


  # ============================================================
  # 5. JAVA
  # ============================================================

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17
      cache: gradle


  # ============================================================
  # 6. ANDROID SDK
  # ============================================================

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3


  # ============================================================
  # 7. ACCEPT ANDROID LICENSES
  # ============================================================

  - name: Accept Android licenses
    run: yes | sdkmanager --licenses || true


  # ============================================================
  # 8. GENERATE ANDROID PROJECT
  # ============================================================

  - name: Generate Android project
    run: npx expo prebuild --platform android --clean


  # ============================================================
  # 9. CONFIGURE GRADLE MEMORY
  # ============================================================

  - name: Configure Gradle
    working-directory: android
    shell: bash
    run: |
      mkdir -p ~/.gradle

      cat >> gradle.properties <<'EOF'

      org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
      org.gradle.daemon=false
      org.gradle.parallel=false
      org.gradle.workers.max=2
      EOF


  # ============================================================
  # 10. MAKE GRADLE EXECUTABLE
  # ============================================================

  - name: Make Gradle executable
    working-directory: android
    run: chmod +x gradlew


  # ============================================================
  # 11. CLEAN ANDROID BUILD
  # ============================================================

  - name: Clean Android
    working-directory: android
    run: ./gradlew clean --no-daemon


  # ============================================================
  # 12. BUILD RELEASE APK
  # ============================================================

  - name: Build Release APK
    working-directory: android
    run: ./gradlew assembleRelease --no-daemon --max-workers=2


  # ============================================================
  # 13. VERIFY APK
  # ============================================================

  - name: Verify APK
    shell: bash
    run: |
      APK="android/app/build/outputs/apk/release/app-release.apk"

      if [ ! -f "$APK" ]; then
        echo "❌ APK NOT FOUND"
        exit 1
      fi

      SIZE=$(stat -c%s "$APK")

      echo "APK: $APK"
      echo "APK size: $SIZE bytes"

      if [ "$SIZE" -lt 1000000 ]; then
        echo "❌ APK size suspiciously small"
        exit 1
      fi

      echo "✅ APK generated successfully"


  # ============================================================
  # 14. UPLOAD APK
  # ============================================================

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: auto-bidder-release-apk
      path: android/app/build/outputs/apk/release/app-release.apk
      retention-days: 7


  # ============================================================
  # 15. INSTALL EMULATOR COMPONENTS
  # ============================================================

  - name: Install Android Emulator
    run: |
      sdkmanager "platform-tools"
      sdkmanager "emulator"
      sdkmanager "platforms;android-35"
      sdkmanager "system-images;android-35;google_apis;x86_64"


  # ============================================================
  # 16. CREATE EMULATOR
  # ============================================================

  - name: Create Android Emulator
    run: |
      echo "no" | avdmanager create avd \
        -n auto-bidder-test \
        -k "system-images;android-35;google_apis;x86_64" \
        --force


  # ============================================================
  # 17. START EMULATOR
  # ============================================================

  - name: Start Android Emulator
    shell: bash
    run: |
      nohup emulator \
        -avd auto-bidder-test \
        -no-window \
        -no-audio \
        -no-boot-anim \
        -no-snapshot \
        -gpu swiftshader_indirect \
        > emulator.log 2>&1 &

      adb wait-for-device

      echo "Waiting for Android boot..."

      for i in {1..60}; do
        BOOT=$(adb shell getprop sys.boot_completed | tr -d '\r')

        if [ "$BOOT" = "1" ]; then
          echo "Android boot completed"
          break
        fi

        echo "Waiting... $i"
        sleep 2
      done

      adb shell settings put global window_animation_scale 0
      adb shell settings put global transition_animation_scale 0
      adb shell settings put global animator_duration_scale 0

      adb devices


  # ============================================================
  # 18. CLEAR LOGCAT
  # ============================================================

  - name: Clear Logcat
    run: adb logcat -c


  # ============================================================
  # 19. INSTALL APK
  # ============================================================

  - name: Install APK on emulator
    run: |
      adb install -r android/app/build/outputs/apk/release/app-release.apk


  # ============================================================
  # 20. VERIFY INSTALLATION
  # ============================================================

  - name: Verify APK installation
    run: |
      adb shell pm list packages | grep -i "autobidder" || true


  # ============================================================
  # 21. LAUNCH APP
  # ============================================================

  - name: Launch Auto Bidder
    run: |
      echo "Launching Auto Bidder..."

      adb shell monkey \
        -p in.autobidder.app \
        -c android.intent.category.LAUNCHER \
        1

      sleep 10


  # ============================================================
  # 22. START LOGCAT MONITOR
  # ============================================================

  - name: Start Logcat Monitor
    shell: bash
    run: |
      adb logcat > live-logcat.txt 2>&1 &

      echo $! > logcat.pid

      sleep 35


  # ============================================================
  # 23. COLLECT LOGS
  # ============================================================

  - name: Collect crash logs
    if: always()
    run: |
      adb logcat -d > crash-log.txt

      echo ""
      echo "========================================"
      echo "FATAL EXCEPTION"
      echo "========================================"

      grep -i -A 40 -B 10 \
        "FATAL EXCEPTION" \
        crash-log.txt || true


      echo ""
      echo "========================================"
      echo "ANDROID RUNTIME"
      echo "========================================"

      grep -i -A 40 -B 10 \
        "AndroidRuntime" \
        crash-log.txt || true


      echo ""
      echo "========================================"
      echo "REACT NATIVE JS"
      echo "========================================"

      grep -i -A 30 -B 10 \
        "ReactNativeJS" \
        crash-log.txt || true


      echo ""
      echo "========================================"
      echo "NATIVE ERRORS"
      echo "========================================"

      grep -Ei -A 20 -B 10 \
        "UnsatisfiedLinkError|ClassNotFoundException|NoSuchMethodError|NoClassDefFoundError|IllegalStateException|SecurityException" \
        crash-log.txt || true


      echo ""
      echo "========================================"
      echo "EXPO / REACT NATIVE MODULES"
      echo "========================================"

      grep -Ei -A 20 -B 10 \
        "FirebaseApp|Stripe|Reanimated|Worklets|RNSScreen|safe-area|expo" \
        crash-log.txt || true


  # ============================================================
  # 24. CHECK APP PROCESS
  # ============================================================

   name: Check application process
    if: always()
    run: |
      echo "Checking application process..."

      adb shell pidof in.autobidder.app || true

      echo ""
      echo "Package information:"
      adb shell dumpsys package in.autobidder.app | head -100 || true


  # ============================================================
  # 25. DETECT STARTUP CRASH
  # ============================================================

  - name: Detect startup crash
    run: |
      if grep -Eiq \
        "FATAL EXCEPTION|AndroidRuntime.*FATAL|UnsatisfiedLinkError|ClassNotFoundException|NoSuchMethodError|NoClassDefFoundError" \
        crash-log.txt
      then

        echo ""
        echo "========================================"
        echo "❌ STARTUP CRASH DETECTED"
        echo "========================================"

        echo ""
        echo "Relevant crash:"
        grep -Ei -A 50 -B 15 \
          "FATAL EXCEPTION|AndroidRuntime|UnsatisfiedLinkError|ClassNotFoundException|NoSuchMethodError|NoClassDefFoundError" \
          crash-log.txt || true

        exit 1

      else

        echo ""
        echo "========================================"
        echo "✅ NO NATIVE STARTUP CRASH DETECTED"
        echo "========================================"

      fi


  # ============================================================
  # 26. UPLOAD CRASH LOGS
  # ============================================================

  - name: Upload crash logs
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: auto-bidder-crash-logs
      path: |
        crash-log.txt
        live-logcat.txt
        emulator.log
      retention-days: 14

