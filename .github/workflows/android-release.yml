name: Auto Bidder - Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      NODE_ENV: production
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      NODE_OPTIONS: --max-old-space-size=4096
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify Expo
        run: |
          node --version
          npm --version
          npx expo --version

      - name: Generate Android project
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean --non-interactive

      - name: Verify Android project
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Clean Gradle
        working-directory: apps/mobile/android
        run: |
          ./gradlew clean \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      - name: Build Release APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --warning-mode=all

      - name: Verify APK
        run: |
          ls -lah apps/mobile/android/app/build/outputs/apk/release/
          test -f apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-bidder-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
