name: Auto Bidder - Android APK + Crash Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Production Environment
        run: |
          mkdir -p apps/mobile

          cat > apps/mobile/.env <<'EOF'
          EXPO_PUBLIC_API_BASE_URL=https://api.autobidder.in
          EXPO_PUBLIC_SOCKET_URL=https://api.autobidder.in
          EOF

          cat apps/mobile/.env

      - name: Install Root Dependencies
        run: npm install

      - name: Install Mobile Dependencies
        working-directory: apps/mobile
        run: npm install

      - name: Generate Android Project
        working-directory: apps/mobile
        run: npx expo prebuild --clean

      - name: Configure Gradle
        working-directory: apps/mobile/android
        run: |
          cat >> gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=4096m
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          kotlin.daemon.jvm.options=-Xmx4096m
          EOF

          chmod +x gradlew

      - name: Clean Android
        working-directory: apps/mobile/android
        run: |
          ./gradlew clean \
            --no-daemon \
            --max-workers=1

      - name: Build Release APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease \
            -x lintVitalAnalyzeRelease \
            --no-daemon \
            --max-workers=1

      - name: Verify APK
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          echo "APK CREATED SUCCESSFULLY"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Bidder-Release-APK
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  crash-test:
    name: Emulator Crash Test
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Auto-Bidder-Release-APK
          path: apk

      - name: Install Emulator
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      - name: Create AVD
        run: |
          echo "no" | avdmanager create avd \
            --name auto-bidder-test \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          emulator -list-avds

      - name: Start Emulator
        run: |
          mkdir -p crash-logs

          nohup emulator \
            -avd auto-bidder-test \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            -no-save \
            > crash-logs/emulator.log 2>&1 &

          echo $! > crash-logs/emulator.pid

          adb start-server

          READY=false

          for i in {1..36}; do
            echo "Waiting for emulator... $i/36"

            if adb devices | grep -E "emulator-[0-9]+[[:space:]]+device" >/dev/null 2>&1; then
              READY=true
              echo "Emulator connected"
              break
            fi

            sleep 5
          done

          if [ "$READY" != "true" ]; then
            echo "Emulator did not connect"
            cat crash-logs/emulator.log || true
            adb devices -l || true
            exit 1
          fi

          BOOTED=false

          for i in {1..36}; do
            BOOT_STATUS=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)

            echo "Boot status: $BOOT_STATUS"

            if [ "$BOOT_STATUS" = "1" ]; then
              BOOTED=true
              echo "Android boot completed"
              break
            fi

            sleep 5
          done

          if [ "$BOOTED" != "true" ]; then
            echo "Android failed to boot"

            adb logcat -d > crash-logs/emulator-logcat.txt || true
            cat crash-logs/emulator.log || true

            exit 1
          fi

          echo "EMULATOR READY"

      - name: Install APK
        run: |
          APK=$(find apk -name "*.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          adb install -r "$APK"

          echo "APK INSTALLED"

      - name: Clear Logcat
        run: |
          adb logcat -c || true

      - name: Launch Auto Bidder
        run: |
          adb shell monkey \
            -p com.autobidder.app \
            -c android.intent.category.LAUNCHER \
            1

          sleep 10

      - name: Check App Launch
        run: |
          if adb shell pidof com.autobidder.app >/dev/null 2>&1; then
            echo "APP STARTED"
          else
            echo "APP CRASHED ON START"
            adb logcat -d | tail -n 500 || true
            exit 1
          fi

      - name: Monitor App
        run: |
          echo "Monitoring app for 60 seconds..."

          for i in {1..12}; do
            echo "Check $i/12"

            if adb shell pidof com.autobidder.app >/dev/null 2>&1; then
              echo "App running"
            else
              echo "APP STOPPED"

              adb logcat -d | tail -n 500 || true
              exit 1
            fi

            sleep 5
          done

          echo "60 SECOND TEST PASSED"

      - name: Capture Crash Logs
        if: always()
        run: |
          mkdir -p crash-logs

          adb logcat -d > crash-logs/logcat.txt 2>/dev/null || true

          adb logcat -d | grep -Ei \
            "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|Hermes|Reanimated|Worklets|SIGSEGV|SIGABRT|Fatal signal|Unable to start activity|RuntimeException" \
            > crash-logs/filtered-crash.log || true

          adb shell dumpsys package com.autobidder.app \
            > crash-logs/package-info.txt 2>/dev/null || true

          adb shell dumpsys activity activities \
            > crash-logs/activity.txt 2>/dev/null || true

          adb shell dumpsys meminfo com.autobidder.app \
            > crash-logs/meminfo.txt 2>/dev/null || true

          adb devices -l \
            > crash-logs/adb-devices.txt 2>/dev/null || true

          echo "Crash logs captured"

      - name: Detect Crash
        run: |
          LOG="crash-logs/logcat.txt"

          if grep -Eiq \
            "FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|Unable to start activity|Process: com.autobidder.app.*died" \
            "$LOG"; then

            echo "AUTO BIDDER CRASH DETECTED"
            cat crash-logs/filtered-crash.log || true
            exit 1
          fi

          if ! adb shell pidof com.autobidder.app >/dev/null 2>&1; then
            echo "AUTO BIDDER PROCESS NOT RUNNING"
            cat crash-logs/filtered-crash.log || true
            exit 1
          fi

          echo "NO FATAL CRASH DETECTED"

      - name: Upload Crash Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Bidder-Crash-Logs
          path: crash-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Test Passed
        if: success()
        run: |
          echo "=========================================="
          echo "AUTO BIDDER BUILD + CRASH TEST PASSED"
          echo "=========================================="
          echo "APK BUILD PASSED"
          echo "EMULATOR BOOT PASSED"
          echo "APK INSTALL PASSED"
          echo "APP LAUNCH PASSED"
          echo "60 SECOND MONITOR PASSED"
          echo "NO FATAL CRASH DETECTED"
          echo "=========================================="
