<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoBidder Admin | Advanced Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body class="not-auth">

    <div id="login-screen">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 2rem;">
                <img src="assets/hdlogo.png" alt="AutoBidder Logo" style="height: 50px; margin-bottom: 1rem;">
                <h2 style="font-size: 1.5rem;">Admin Portal</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Secure Authentication Required</p>
            </div>

            <form onsubmit="handleLogin(event)">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-bottom: 0.5rem; color: var(--text-muted);">Email Address</label>
                    <input type="email" id="login-email" class="login-input" placeholder="admin@autobidder.in" required>
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-bottom: 0.5rem; color: var(--text-muted);">Password</label>
                    <input type="password" id="login-password" class="login-input" placeholder="••••••••" required>
                </div>
                <div id="login-err" class="login-error" style="color: var(--danger); font-size: 0.8rem; margin-bottom: 1rem; text-align: center;"></div>
                <button class="btn btn-primary" style="width: 100%; height: 50px; justify-content: center; font-size: 1rem;" type="submit" id="login-btn">
                    Authenticate
                </button>
            </form>
        </div>
    </div>

    <header>
        <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        <a href="#" style="display: flex; align-items: center;">
            <img src="assets/hdlogo.png" alt="AutoBidder Logo" class="admin-header-logo">
        </a>

        <div class="header-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search across platform..." id="globalSearch" autocomplete="off">
            <div id="search-results-dropdown"></div>
        </div>

        <div class="header-right">
            <div id="env-badge" class="badge badge-success" style="font-size: 10px; padding: 2px 8px;">LIVE</div>

            <select id="envSelector" style="background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 0.7rem; padding: 4px 8px; font-weight: 700; color: var(--dark); cursor: pointer; outline: none;">
                <option value="https://api.autobidder.in">PRODUCTION</option>
                <option value="http://localhost:4000">LOCAL DEV</option>
            </select>

            <div class="api-config" style="display: flex; align-items: center; gap: 8px; background: var(--bg); padding: 6px 16px; border-radius: 99px; border: 1px solid var(--border);">
                <div class="status-dot" id="status-indicator"></div>
                <input id="apiBase" type="text" placeholder="API Base" style="border: none; background: transparent; font-size: 0.75rem; width: 120px; outline: none; display: none;">
                <button onclick="reconnect()" style="background: none; border: none; color: var(--secondary); cursor: pointer; font-size: 0.7rem; font-weight: 800;">SYNC</button>
            </div>
            <div style="width: 1px; height: 32px; background: var(--border);"></div>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <div style="text-align: right;">
                    <div style="font-size: 0.85rem; font-weight: 700;">Admin User</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted);">Super Control</div>
                </div>
                <div class="avatar" style="width: 40px; height: 40px; background: var(--secondary); color: white; border-radius: 12px; display: grid; place-items: center; font-weight: 700;">AD</div>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside id="sidebar">
            <div class="sidebar-logo-container">
                <img src="assets/hdlogo.png" alt="Logo" style="width: 140px; filter: brightness(0) invert(1);">
            </div>

            <div class="sidebar-group">
                <div class="sidebar-label">Analytics</div>
                <button class="nav-item active" data-mod="dashboard" onclick="nav('dashboard')">
                    <span class="icon"><i class="fa-solid fa-gauge-high"></i></span> <span>Dashboard</span>
                </button>
                <button class="nav-item" data-mod="analytics" onclick="nav('analytics')">
                    <span class="icon"><i class="fa-solid fa-chart-line"></i></span> <span>Revenue</span>
                </button>
            </div>

            <div class="sidebar-group">
                <div class="sidebar-label">Catalog</div>
                <button class="nav-item" data-mod="vehicles" onclick="nav('vehicles')">
                    <span class="icon"><i class="fa-solid fa-car"></i></span> <span>Vehicles</span>
                </button>
                <button class="nav-item" data-mod="auctions" onclick="nav('auctions')">
                    <span class="icon"><i class="fa-solid fa-gavel"></i></span> <span>Live Auctions</span>
                </button>
                <button class="nav-item" data-mod="brands" onclick="nav('brands')">
                    <span class="icon"><i class="fa-solid fa-tags"></i></span> <span>Brands</span>
                </button>
                <button class="nav-item" data-mod="collections" onclick="nav('collections')">
                    <span class="icon"><i class="fa-solid fa-layer-group"></i></span> <span>Collections</span>
                </button>
            </div>

            <div class="sidebar-group">
                <div class="sidebar-label">Partnerships</div>
                <button class="nav-item" data-mod="dnp_leads" onclick="nav('dnp_leads')">
                    <span class="icon"><i class="fa-solid fa-handshake"></i></span> <span>DNP Leads</span>
                </button>
                <button class="nav-item" data-mod="dnp_withdrawals" onclick="nav('dnp_withdrawals')">
                    <span class="icon"><i class="fa-solid fa-money-bill-transfer"></i></span> <span>Withdrawals</span>
                </button>
                <button class="nav-item" data-mod="dealers" onclick="nav('dealers')">
                    <span class="icon"><i class="fa-solid fa-building-user"></i></span> <span>Dealer Network</span>
                </button>
            </div>

            <div class="sidebar-group">
                <div class="sidebar-label">Community</div>
                <button class="nav-item" data-mod="users" onclick="nav('users')">
                    <span class="icon"><i class="fa-solid fa-user-group"></i></span> <span>Customers</span>
                </button>
                <button class="nav-item" data-mod="sellers" onclick="nav('sellers')">
                    <span class="icon"><i class="fa-solid fa-user-shield"></i></span> <span>Verifications</span>
                </button>
                <button class="nav-item" data-mod="news" onclick="nav('news')">
                    <span class="icon"><i class="fa-solid fa-newspaper"></i></span> <span>News & Blog</span>
                </button>
            </div>

            <div class="sidebar-group">
                <div class="sidebar-label">Operations</div>
                <button class="nav-item" data-mod="payments" onclick="nav('payments')">
                    <span class="icon"><i class="fa-solid fa-wallet"></i></span> <span>Payments</span>
                </button>
                <button class="nav-item" data-mod="leads" onclick="nav('leads')">
                    <span class="icon"><i class="fa-solid fa-headset"></i></span> <span>Inquiries</span>
                </button>
                <button class="nav-item" data-mod="sliders" onclick="nav('sliders')">
                    <span class="icon"><i class="fa-solid fa-clapperboard"></i></span> <span>CMS Sliders</span>
                </button>
            </div>

            <div class="sidebar-group">
                <div class="sidebar-label">System</div>
                <button class="nav-item" data-mod="system_health" onclick="nav('system_health')">
                    <span class="icon"><i class="fa-solid fa-heart-pulse"></i></span> <span>Health Monitor</span>
                </button>
                <button class="nav-item" data-mod="logs" onclick="nav('logs')">
                    <span class="icon"><i class="fa-solid fa-terminal"></i></span> <span>Audit Logs</span>
                </button>
            </div>

            <div style="margin-top: auto; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1);">
                <button class="nav-item" onclick="logout()" style="color: var(--danger); opacity: 1;">
                    <span class="icon"><i class="fa-solid fa-power-off"></i></span> <span>Sign Out</span>
                </button>
            </div>
        </aside>

        <main id="main">
            <div id="content" class="animate-fade">
                <!-- Data Content -->
            </div>
        </main>
    </div>

    <!-- DETAIL DRAWER -->
    <div id="detail-overlay" onclick="closeDetail()"></div>
    <div id="detail-panel">
        <div style="padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: #F8FAFC;">
            <h2 id="detail-title" style="font-size: 1.25rem;">Intelligence View</h2>
            <button class="btn btn-secondary" style="padding: 8px 12px;" onclick="closeDetail()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div style="flex: 1; overflow-y: auto;" id="detail-content"></div>
        <div style="padding: 1.5rem 2rem; border-top: 1px solid var(--border); display: flex; gap: 1rem; background: #F8FAFC;" id="detail-actions"></div>
    </div>

    <!-- PREVIEW OVERLAY -->
    <div id="preview-overlay" onclick="closePreview(event)">
        <div class="preview-card" onclick="event.stopPropagation()">
            <div class="preview-head">
                <h3 id="preview-title" style="margin:0; font-size:16px; color:#000">Document Preview</h3>
                <div style="display:flex; gap:10px">
                    <a id="preview-download" href="#" target="_blank" class="btn btn-secondary" style="padding:6px 12px; font-size:12px">
                        <i class="fa-solid fa-download"></i> Open Original
                    </a>
                    <button class="btn btn-danger" style="padding:6px 12px; font-size:12px" onclick="closePreview()">✕ Close</button>
                </div>
            </div>
            <div id="preview-content" class="preview-content"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--card); border:1px solid var(--border); padding:12px 24px; border-radius:99px; display:flex; align-items:center; gap:12px; z-index:9999; transition: transform 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.1)">
        <div id="toast-icon"></div>
        <div id="toast-msg">Action successful</div>
    </div>

    <script src="app.js"></script>
    <script>
        // ───────────────────────────────────────────────
        // APP STATE & CONFIG
        // ───────────────────────────────────────────────
        let activeModule = 'dashboard';
        const root = document.getElementById('content');
        const indicator = document.getElementById('status-indicator');

        function updateAuthState() {
            const isAuth = !!adminApp.token;
            document.body.className = isAuth ? 'auth' : 'not-auth';
            if (isAuth && activeModule === 'dashboard') {
                reconnect();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const err = document.getElementById('login-err');
            const btn = document.getElementById('login-btn');

            err.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Authenticating...';

            try {
                await adminApp.login(email, password);
                updateAuthState();
            } catch (e) {
                err.textContent = e.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Authorize Access';
            }
        }

        function logout() {
            adminApp.logout();
            updateAuthState();
        }

        async function reconnect() {
            if (!adminApp.token) {
                updateAuthState();
                return;
            }
            showToast('🔄 Synchronizing with backend...', 'info');
            try {
                const data = await adminApp.getDashboardStats();
                indicator.className = 'status-dot online';
                showToast('✅ Backend Connected', 'success');
                loadModule(activeModule);
            } catch (e) {
                indicator.className = 'status-dot offline';
                const isAuthError = e.message.includes('Unauthorized') || e.message.includes('401');
                if (isAuthError) {
                    adminApp.token = null;
                    updateAuthState();
                } else {
                    showToast('❌ Connection Failed', 'error');
                    renderError(e);
                }
            }
        }

        // ───────────────────────────────────────────────
        // NAVIGATION
        // ───────────────────────────────────────────────
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function nav(mod) {
            activeModule = mod;
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.mod === mod);
            });
            document.getElementById('sidebar').classList.remove('open');
            loadModule(mod);
        }

        function loadModule(mod) {
            root.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:400px">
                <div class="loader"></div>
                <p style="margin-top:20px; color:var(--muted)">Fetching ${mod} data...</p>
            </div>`;

            const handlers = {
                dashboard: renderDashboard,
                users: renderUsers,
                dealers: renderDealers,
                sellers: renderSellers,
                vehicles: renderVehicles,
                auctions: renderAuctions,
                analytics: renderAnalytics,
                fraud: renderFraud,
                payments: renderPayments,
                commissions: renderCommissions,
                logs: renderLogs,
                notifications: renderNotifications,
                sliders: renderSliders,
                brands: renderBrands,
                bids: renderBids,
                delivery: renderDelivery,
                autobid: renderAutoBids,
                leads: renderLeads,
                payouts: renderPayouts,
                appointments: renderAppointments,
                rtonoc: renderRtoNoc,
                pushtokens: renderPushTokens,
                dnp_leads: renderDnpLeads,
                dnp_withdrawals: renderDnpWithdrawals,
                news: renderNews,
                collections: renderCollections,
                system_health: renderSystemHealth
            };

            (handlers[mod] || renderDashboard)();
        }

        // ───────────────────────────────────────────────
        // MODULE RENDERERS
        // ───────────────────────────────────────────────

        async function renderDashboard() {
            try {
                const data = await adminApp.getDashboardStats();
                const s = data.stats || {};
                root.innerHTML = `
                    <div class="page-header">
                        <div class="page-title">
                            <h1>Platform Overview</h1>
                            <p>Real-time system health and performance metrics</p>
                        </div>
                        <div style="display:flex; gap:10px">
                            <button class="btn btn-secondary" onclick="adminApp.seedData().then(() => renderDashboard())">✨ Seed Demo</button>
                            <button class="btn btn-primary" onclick="renderDashboard()">↺ Refresh</button>
                        </div>
                    </div>
                    <div class="grid-responsive">
                        ${statCard('Total Users', s.users || 0, '👥', 'var(--info)')}
                        ${statCard('Active Dealers', s.dealers || 0, '🏢', 'var(--warning)')}
                        ${statCard('Total Revenue', fmtINR(s.totalRevenue || 0), '💰', 'var(--success)')}
                        ${statCard('Pending Tasks', (s.pendingListings || 0) + (s.pendingSellers || 0), '🛡️', 'var(--danger)')}
                    </div>
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:1.5rem">
                        <div class="table-container">
                            <div style="padding: 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                                <h3 style="font-size: 1.1rem;">Recent Vehicle Submissions</h3>
                                <button class="btn btn-secondary" style="padding: 4px 12px; font-size: 0.8rem;" onclick="nav('vehicles')">View All</button>
                            </div>
                            ${renderListingTable(data.recentListings || [])}
                        </div>
                        <div class="card">
                            <h3 style="font-size: 1.1rem; margin-bottom: 1.5rem;">Security Monitor</h3>
                            <div style="display: flex; flex-direction: column; gap: 1rem;">
                                <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--border);">
                                    <span style="font-size: 0.9rem; font-weight: 500;">Fraud Alerts</span>
                                    <span class="badge badge-danger">Critical Alerts</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 1rem; border-bottom: 1px solid var(--border);">
                                    <span style="font-size: 0.9rem; font-weight: 500;">Verification Queue</span>
                                    <span class="badge badge-warning">${s.pendingSellers || 0} Pending</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <span style="font-size: 0.9rem; font-weight: 500;">Failed Logins</span>
                                    <span style="font-weight: 700; color: var(--text-muted);">Monitor Logs</span>
                                </div>
                                <button class="btn btn-primary" style="margin-top: 1rem; width: 100%; justify-content: center;" onclick="nav('fraud')">Fraud Dashboard</button>
                            </div>
                        </div>
                    </div>

                `;
            } catch (e) { renderError(e); }
        }

        async function renderUsers() {
            try {
                const data = await adminApp.getUsers();
                const users = data.users || [];
                root.innerHTML = `
                    <div class="page-header">
                        <div class="page-title">
                            <h1>User Directory</h1>
                            <p>Manage customers, sellers and platform permissions</p>
                        </div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>User Profile</th>
                                    <th>Contact Information</th>
                                    <th>Status</th>
                                    <th>Activity</th>
                                    <th>Joined</th>
                                    <th style="text-align: right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${users.map(u => `
                                    <tr>
                                        <td>
                                            <div style="display:flex; align-items:center; gap:12px">
                                                <div class="avatar" style="width:36px; height:36px; font-size:12px; background:var(--bg); color:var(--secondary); border-radius:8px; border:1px solid var(--border); display:grid; place-items:center;">
                                                    ${(u.name || 'U')[0].toUpperCase()}
                                                </div>
                                                <div>
                                                    <div style="font-weight:700">${u.name || 'Anonymous'}</div>
                                                    <div style="font-size:11px; color:var(--text-muted); cursor: pointer;" onclick="copyToClipboard('${u.id}')">ID: ${u.id.slice(0,8)} <i class="fa-regular fa-copy"></i></div>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <div style="font-size:13px">${u.email || '—'}</div>
                                            <div style="font-size:11px; color:var(--text-muted)">${u.phone || '—'}</div>
                                        </td>
                                        <td>${u.isVerified ? badge('Verified', 'success') : badge('Pending', 'warning')}</td>
                                        <td>
                                            <div style="font-size:11px; font-weight:600;">🔨 ${u._count?.bids || 0} Bids</div>
                                            <div style="font-size:11px; color:var(--text-muted)">📦 ${u._count?.listings || 0} Listings</div>
                                        </td>
                                        <td style="font-size:12px; color:var(--text-muted)">${fmtDate(u.createdAt)}</td>
                                        <td style="text-align: right;">
                                            <div style="display:flex; gap:6px; justify-content: flex-end;">
                                                <button class="btn btn-secondary" style="padding:4px 10px; font-size:11px" onclick="showUserDetails('${u.id}')">View</button>
                                                <button class="btn btn-secondary" style="padding:4px 10px; font-size:11px; color: var(--danger);" onclick="deleteUser('${u.id}')">Delete</button>
                                            </div>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (e) { renderError(e); }
        }

        async function renderDealers() {
            try {
                const data = await adminApp.getDealers();
                const dealers = data.dealers || [];
                root.innerHTML = `
                    <div class="page-header">
                        <div class="page-title">
                            <h1>Dealer Network</h1>
                            <p>Manage certified showroom partners and showrooms</p>
                        </div>
                        <button class="btn btn-primary" onclick="showAddDealerForm()">+ Add Dealer</button>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Showroom / Dealer</th>
                                    <th>Location</th>
                                    <th>Inventory</th>
                                    <th>Premium</th>
                                    <th>Verification</th>
                                    <th style="text-align: right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${dealers.map(d => `
                                    <tr>
                                        <td>
                                            <div style="display:flex; align-items:center; gap:12px">
                                                <div class="avatar" style="width:36px; height:36px; font-size:12px; background:var(--secondary); color:white; border-radius:8px; display:grid; place-items:center;">
                                                    ${(d.businessName || d.name || 'D')[0]}
                                                </div>
                                                <div>
                                                    <div style="font-weight:700">${d.businessName || d.name}</div>
                                                    <div style="font-size:11px; color:var(--text-muted)">${d.email}</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td>${d.city || 'N/A'}</td>
                                        <td>
                                            <div style="font-weight:600">${d._count?.listings || 0} Cars</div>
                                            <div style="font-size:10px; color:var(--text-muted)">${d._count?.soldListings || 0} Sold</div>
                                        </td>
                                        <td>
                                            <label class="switch">
                                                <input type="checkbox" ${d.isFeatured ? 'checked' : ''} onchange="toggleDealerPromotion('${d.id}', this.checked)">
                                                <span class="slider"></span>
                                            </label>
                                        </td>
                                        <td>${badge(d.status || 'VERIFIED', d.status === 'PENDING' ? 'warning' : 'success')}</td>
                                        <td style="text-align: right;">
                                            <button class="btn btn-secondary" style="padding:4px 10px; font-size:11px" onclick="showDealerDetails('${d.id}')">Manage</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (e) { renderError(e); }
        }

        async function renderSellers() {
            try {
                const data = await adminApp.getUsers();
                const pending = (data.users || []).filter(u => !u.isVerified);
                root.innerHTML = `
                    <div class="page-header">
                        <div class="page-title">
                            <h1>Seller Verification</h1>
                            <p>Review KYC documents and approve sellers for listing vehicles</p>
                        </div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Seller Name</th>
                                    <th>Registration Date</th>
                                    <th>Identity Documents</th>
                                    <th style="text-align: right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${pending.map(u => `
                                    <tr>
                                        <td>
                                            <div style="font-weight:700">${u.name}</div>

        // --- UI Helpers ---
        function statCard(label, value, icon, color) {
            return `<div class="card stat-card"><div style="display:flex; justify-content:space-between"><div>${label}</div><div style="color:${color}">${icon}</div></div><div class="stat-value">${value}</div></div>`;
        }
        function badge(text, type) { return `<span class="badge badge-${type}">${text}</span>`; }
        function fmtINR(v) { return '₹' + Number(v).toLocaleString('en-IN'); }
        function fmtDate(v) { return new Date(v).toLocaleDateString('en-IN'); }
        function fmtTimeAgo(v) {
            const sec = Math.floor((new Date() - new Date(v)) / 1000);
            if(sec < 60) return 'now';
            if(sec < 3600) return Math.floor(sec/60) + 'm';
            return Math.floor(sec/3600) + 'h';
        }
        function renderListingTable(list) {
            return `<table><thead><tr><th>Vehicle</th><th>Status</th><th>Price</th></tr></thead><tbody>${list.map(l => `<tr><td>${l.title}</td><td>${badge(l.status, 'info')}</td><td>${fmtINR(l.demandPrice)}</td></tr>`).join('')}</tbody></table>`;
        }
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            t.style.transform = 'translateX(-50%) translateY(0)';
            setTimeout(() => t.style.transform = 'translateX(-50%) translateY(100px)', 3000);
        }
        function openDetail(title, html, actions) {
            document.getElementById('detail-title').textContent = title;
            document.getElementById('detail-content').innerHTML = html;
            document.getElementById('detail-actions').innerHTML = actions || '';
            document.getElementById('detail-panel').classList.add('open');
            document.getElementById('detail-overlay').classList.add('open');
        }
        function closeDetail() { document.getElementById('detail-panel').classList.remove('open'); document.getElementById('detail-overlay').classList.remove('open'); }
        function docButton(url, title) { return `<button class="btn btn-secondary" onclick="previewDocument('${url}', '${title}')">View</button>`; }
        function previewDocument(url, title) {
            document.getElementById('preview-title').textContent = title;
            document.getElementById('preview-content').innerHTML = url.includes('.pdf') ? `<iframe src="${url}"></iframe>` : `<img src="${url}">`;
            document.getElementById('preview-overlay').classList.add('open');
        }
        function closePreview() { document.getElementById('preview-overlay').classList.remove('open'); }
        function copyToClipboard(t) { navigator.clipboard.writeText(t); showToast('Copied', 'info'); }
        function renderError(e) { console.error(e); root.innerHTML = `<div style="padding:2rem; text-align:center"><h2>Error</h2><p>${e.message}</p><button onclick="reconnect()">Retry</button></div>`; }

                            <thead><tr><th>User</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
                            <tbody>
                                ${bids.map(b => `<tr><td>${b.user?.name}</td><td style="font-weight:700">${fmtINR(b.amount)}</td><td>${badge(b.status, 'info')}</td><td>${fmtDate(b.createdAt)}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    </div>` : '<p style="padding:20px; text-align:center">No bid history found for this vehicle.</p>';
                openDetail('Auction Bid History', html);
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function quickBidStatus(id, status) {
            try {
                await adminApp.updateBidStatus(id, status);
                showToast('Bid ' + status.toLowerCase(), 'success');
                loadModule('bids');
            } catch (e) { showToast(e.message, 'error'); }
        }

        // --- User/Dealer Actions ---
        async function showUserDetails(id) {
            try {
                const u = await adminApp.getUserById(id);
                const html = `
                    <div style="padding:10px">
                        <div style="display:flex; gap:20px; align-items:center; margin-bottom:20px">
                            <div class="avatar" style="width:60px; height:60px; font-size:20px">${(u.name || 'U')[0].toUpperCase()}</div>
                            <div>
                                <h2 style="margin:0">${u.name || 'Anonymous'}</h2>
                                <p style="color:var(--text-muted); margin:0">${u.email}</p>
                            </div>
                        </div>
                        <div class="grid-responsive" style="grid-template-columns: 1fr 1fr; gap:10px">
                            <div class="card" style="padding:15px"><h3>Phone</h3><p>${u.phone || 'N/A'}</p></div>
                            <div class="card" style="padding:15px"><h3>Status</h3><p>${u.isVerified ? badge('Verified', 'success') : badge('Pending', 'warning')}</p></div>
                        </div>
                        <h3>Activity Summary</h3>
                        <p>Total Listings: ${u._count?.listings || 0}</p>
                        <p>Total Bids: ${u._count?.bids || 0}</p>
                    </div>
                `;
                openDetail('Customer Intelligence', html, `
                    <button class="btn btn-secondary" style="color:var(--danger)" onclick="deleteUser('${u.id}')">Delete Account</button>
                    <button class="btn btn-primary" onclick="verifySeller('${u.id}', true)">Verify User</button>
                `);
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function showDealerDetails(id) {
            try {
                const d = await adminApp.getDealerById(id);
                const html = `
                    <div style="padding:10px">
                        <h2>${d.businessName || d.name}</h2>
                        <div class="grid-responsive" style="grid-template-columns: 1fr 1fr; gap:10px">
                            <div class="card" style="padding:15px"><h3>City</h3><p>${d.city}</p></div>
                            <div class="card" style="padding:15px"><h3>Status</h3><p>${badge(d.status, 'info')}</p></div>
                        </div>
                        <p><b>Contact:</b> ${d.name} (${d.phone})</p>
                        <p><b>Email:</b> ${d.email}</p>
                        <h3>Inventory</h3>
                        <p>Current Cars: ${d._count?.listings || 0}</p>
                    </div>
                `;
                openDetail('Dealer Performance', html, `
                    <button class="btn btn-secondary" style="color:var(--danger)" onclick="deleteDealer('${d.id}')">Remove Partner</button>
                    <button class="btn btn-primary" onclick="updateDealerStatus('${d.id}', 'ACTIVE')">Approve Dealer</button>
                `);
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function updateDealerStatus(id, status) {
            try {
                await adminApp.updateDealerStatus(id, status);
                showToast('Dealer status updated', 'success');
                closeDetail();
                renderDealers();
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function deleteDealer(id) {
            if(!confirm('Are you sure you want to remove this dealer? All related records will be affected.')) return;
            try {
                await adminApp.deleteDealer(id);
                showToast('Dealer removed', 'success');
                closeDetail();
                renderDealers();
            } catch (e) { showToast(e.message, 'error'); }
        }

        // --- Lead/DNP Actions ---
        async function showLeadDetails(id) {
            try {
                const data = await adminApp.getLeads();
                const l = data.leads.find(x => x.id === id);
                const html = `
                    <div style="padding:10px">
                        <h3>Customer: ${l.userName}</h3>
                        <p><b>Phone:</b> ${l.phone}</p>
                        <p><b>Vehicle:</b> ${l.listingTitle}</p>
                        <p><b>Message:</b> ${l.message || 'No additional message'}</p>
                        <p><b>Status:</b> ${badge(l.status, 'info')}</p>
                    </div>
                `;
                openDetail('Inquiry Detail', html);
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function showDnpLeadDetails(id) {
            try {
                const data = await adminApp.getDnpLeads();
                const l = data.leads.find(x => x.id === id);
                const html = `
                    <div style="padding:10px">
                        <h3>Partner: ${l.dnpProfile?.user?.name}</h3>
                        <p><b>Vehicle:</b> ${l.brand} ${l.model} (${l.manufacturingYear})</p>
                        <p><b>Expected Price:</b> ${fmtINR(l.expectedPrice)}</p>
                        <p><b>Owner:</b> ${l.ownerName} (${l.ownerPhone})</p>
                        <p><b>Status:</b> ${badge(l.status, 'warning')}</p>
                    </div>
                `;
                openDetail('DNP Referral Review', html);
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function showAutoBidDetails(id) {
            try {
                const data = await adminApp.getAutoBids();
                const c = data.autoBidConfigs.find(x => x.id === id);
                const html = `
                    <div style="padding:10px">
                        <h3>User: ${c.user?.name}</h3>
                        <p><b>Vehicle:</b> ${c.listing?.title}</p>
                        <p><b>Max Budget:</b> ${fmtINR(c.maxLimit)}</p>
                        <p><b>Increment:</b> ${fmtINR(c.bidIncrement || 5000)}</p>
                        <p><b>Strategy:</b> ${c.isActive ? 'Aggressive (Active)' : 'Paused'}</p>
                    </div>
                `;
                openDetail('Auto-Bid Configuration', html, `
                    <button class="btn btn-secondary" style="color:var(--danger)" onclick="terminateAutoBid('${c.id}')">Terminate Bot</button>
                `);
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function terminateAutoBid(id) {
            if(!confirm('Terminate this bidding agent?')) return;
            try {
                await adminApp.terminateAutoBid(id);
                showToast('Agent terminated', 'success');
                closeDetail();
                renderAutoBids();
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function updateApptStatus(id, status) {
            try {
                await adminApp.updateAppointmentStatus(id, status);
                showToast('Appointment ' + status.toLowerCase(), 'success');
                renderAppointments();
            } catch (e) { showToast(e.message, 'error'); }
        }

        // --- Init ---
        function initSearch() {
            const input = document.getElementById('globalSearch');
            if (input) {
                input.addEventListener('input', async (e) => {
                    const q = e.target.value;
                    if(q.length < 2) {
                        document.getElementById('search-results-dropdown').classList.remove('active');
                        return;
                    }
                    try { const res = await adminApp.globalSearch(q); renderSearchResults(res); } catch(err) {}
                });

                // Close search on click outside
                document.addEventListener('click', (e) => {
                    if (!input.contains(e.target)) {
                        document.getElementById('search-results-dropdown').classList.remove('active');
                    }
                });
            }
        }
        function renderSearchResults(data) {
            const d = document.getElementById('search-results-dropdown');
            const listings = data.listings || [];
            if (!listings.length) {
                d.innerHTML = '<div style="padding:10px; color:var(--text-muted)">No vehicles found</div>';
            } else {
                d.innerHTML = listings.map(l => `<div onclick="showListingDetails('${l.id}')">
                    <img src="${getBrandLogo(l.brand)}" style="width:16px; margin-right:8px">
                    ${l.title} <span style="font-size:10px; opacity:0.6">${l.city}</span>
                </div>`).join('');
            }
            d.classList.add('active');
        }

        updateAuthState();
        initSearch();
        nav('dashboard');
    </script>
</body>
</html>
