name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Production APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NODE_OPTIONS: --max-old-space-size=6144
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;26.1.10909125"

      - name: Verify environment
        run: |
          node --version
          npm --version
          java -version
          adb version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify critical native packages
        run: |
          npm ls expo expo-image-manipulator react-native react-native-reanimated react-native-worklets react-native-gesture-handler @stripe/stripe-react-native @react-native-async-storage/async-storage

      - name: Generate Expo native project
        run: |
          npx expo prebuild --platform android --no-install

      - name: Generate React Native Codegen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew generateCodegenArtifactsFromSchema --no-daemon --max-workers=2

      - name: Clean native build directories
        working-directory: android
        run: |
          rm -rf .cxx
          rm -rf build
          rm -rf app/.cxx
          rm -rf app/build
          find ../node_modules -path "*/android/build" -type d -prune -exec rm -rf {} +
          find ../node_modules -path "*/android/.cxx" -type d -prune -exec rm -rf {} +

      - name: Regenerate Codegen after clean
        working-directory: android
        run: |
          ./gradlew generateCodegenArtifactsFromSchema --no-daemon --max-workers=2

      - name: Verify generated JNI directories
        run: |
          echo "Checking generated Codegen directories..."

          find node_modules -type d -path "*/android/build/generated/source/codegen/jni" | head -50 || true

          if [ ! -d "node_modules/@stripe/stripe-react-native/android/build/generated/source/codegen/jni" ]; then
            echo "WARNING: Stripe Codegen JNI directory is missing"
          fi

          if [ ! -d "node_modules/react-native-gesture-handler/android/build/generated/source/codegen/jni" ]; then
            echo "WARNING: Gesture Handler Codegen JNI directory is missing"
          fi

          if [ ! -d "node_modules/@react-native-async-storage/async-storage/android/build/generated/source/codegen/jni" ]; then
            echo "WARNING: AsyncStorage Codegen JNI directory is missing"
          fi

      - name: Build Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --no-parallel \
            --max-workers=2 \
            --stacktrace

      - name: Verify APK
        run: |
          ls -lah android/app/build/outputs/apk/release/
          test -f android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-bidder-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
