<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoBidder Admin | Advanced Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #F0F4F8;
            --sidebar: #161829;
            --sidebar-text: #D3E2F1;
            --sidebar-active: #FFC107;
            --card: #ffffff;
            --card-hover: #f8fafc;
            --border: #D3E2F1;
            --accent: #266EB9;
            --accent-glow: rgba(38, 110, 185, 0.1);
            --green: #10B981;
            --yellow: #FFC107;
            --red: #FF6F61;
            --purple: #8B5CF6;
            --cyan: #06B6D4;
            --orange: #F97316;
            --text: #161829;
            --muted: #64748B;
            --radius: 12px;
            --header-h: 70px;
            --sidebar-w: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline-color: var(--accent);
        }

        body {
            font-family: 'Open Sans', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, h5, h6, .stat-value, .btn {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
        }

        h1 { font-size: 30px; letter-spacing: -0.02em; }
        h2 { font-size: 26px; }
        h3 { font-size: 22px; }

        /* ── UTILS ── */
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
        }

        .shadow-glow {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05), 0 0 0 1px var(--border);
        }

        /* ── TOP NAV ── */
        header {
            height: var(--header-h);
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: transform 0.2s;
        }

        .admin-header-logo {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .logo:hover { transform: scale(1.02); }

        @media (max-width: 640px) {
            .admin-header-logo { height: 32px; }
        }

        .header-search {
            margin-left: 60px;
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .header-search input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px 8px 36px;
            color: var(--text);
            font-size: 14px;
        }

        .header-search i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 14px;
        }

        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .api-config {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg);
            padding: 4px 12px;
            border-radius: 99px;
            border: 1px solid var(--border);
        }

        .api-config input {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 12px;
            width: 140px;
            outline: none;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
            position: relative;
        }
        .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .status-dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }

        /* ── LAYOUT ── */
        .layout {
            display: flex;
            margin-top: var(--header-h);
            min-height: calc(100vh - var(--header-h));
        }

        /* ── SIDEBAR ── */
        aside {
            width: var(--sidebar-w);
            background: var(--sidebar);
            border-right: 1px solid var(--sidebar);
            position: fixed;
            top: var(--header-h);
            left: 0;
            bottom: 0;
            overflow-y: auto;
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-group {
            margin-bottom: 20px;
        }

        .sidebar-label {
            font-size: 10px;
            font-weight: 800;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            padding: 16px 12px 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--sidebar-text);
            transition: all 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: 'Poppins', sans-serif;
            opacity: 0.8;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            opacity: 1;
        }

        .nav-item.active {
            background: var(--yellow);
            color: #000;
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.2);
            opacity: 1;
        }

        .nav-item .icon { font-size: 16px; width: 24px; text-align: center; }

        /* ── MAIN ── */
        main {
            margin-left: var(--sidebar-w);
            flex: 1;
            padding: 32px 40px;
            max-width: 1600px;
        }

        /* ── PAGE ELEMENTS ── */
        .page-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 32px;
        }

        .page-info h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
        .page-info p { color: var(--muted); font-size: 14px; margin-top: 4px; }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }

        .btn-secondary { background: var(--card); color: var(--text); border-color: var(--border); }
        .btn-secondary:hover { background: var(--card-hover); }

        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--red); border-color: rgba(239, 68, 68, 0.2); }
        .btn-danger:hover { background: var(--red); color: white; }

        /* ── STATS ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .stat-card::after {
            content: ''; position: absolute; top: 0; right: 0; width: 100px; height: 100px;
            background: radial-gradient(circle at top right, var(--accent-glow), transparent 70%);
            opacity: 1;
        }

        .stat-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-value { font-size: 32px; font-weight: 800; margin-top: 8px; }
        .stat-trend { font-size: 12px; margin-top: 8px; display: flex; align-items: center; gap: 4px; }
        .trend-up { color: var(--green); }
        .trend-down { color: var(--red); }

        /* ── TABLE ── */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(0,0,0,0.02);
        }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { padding: 14px 24px; text-align: left; color: var(--muted); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); }
        td { padding: 16px 24px; border-bottom: 1px solid var(--border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(0,0,0,0.02); }

        .badge {
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .badge-green { background: rgba(16, 185, 129, 0.1); color: var(--green); }
        .badge-yellow { background: rgba(245, 158, 11, 0.1); color: var(--yellow); }
        .badge-red { background: rgba(239, 68, 68, 0.1); color: var(--red); }
        .badge-blue { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
        .badge-gray { background: rgba(148, 163, 184, 0.1); color: var(--muted); }

        .avatar {
            width: 36px; height: 36px; border-radius: 10px; background: var(--bg);
            display: grid; place-items: center; font-weight: 700; color: var(--accent);
            border: 1px solid var(--border);
        }

        /* ── DETAIL PANEL ── */
        #detail-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 2000; display: none; }
        #detail-panel {
            position: fixed; top: 0; right: 0; bottom: 0; width: 500px;
            background: var(--sidebar); border-left: 1px solid var(--border);
            z-index: 2001; transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        #detail-panel.open { transform: translateX(0); }
        #detail-overlay.open { display: block; }

        .detail-head { padding: 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .detail-body { flex: 1; overflow-y: auto; padding: 24px; }
        .detail-foot { padding: 20px 24px; border-top: 1px solid var(--border); display: flex; gap: 12px; }

        .detail-row { margin-bottom: 20px; }
        .detail-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
        .detail-value { font-size: 15px; font-weight: 500; }

        /* ── RESPONSIVE ── */
        @media (max-width: 1024px) {
            aside { width: 80px; padding: 20px 10px; }
            .sidebar-label, .nav-item span:not(.icon) { display: none; }
            main { margin-left: 80px; }
            .nav-item .icon { width: 100%; font-size: 22px; }
        }

        /* ── ANIMATIONS ── */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease forwards; }

        /* ── LOADER ── */
        .loader { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── CUSTOM SCROLLBAR ── */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

        /* ── TOGGLE SWITCH ── */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: var(--border); transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* ── PREVIEW OVERLAY ── */
        #preview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        #preview-overlay.open { display: flex; }
        .preview-card {
            width: 100%;
            max-width: 1000px;
            height: 100%;
            max-height: 800px;
            background: var(--sidebar);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }
        .preview-head {
            padding: 16px 24px;
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .preview-content {
            flex: 1;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .preview-content img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .preview-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ── LOGIN SCREEN ── */
        #login-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top right, #266EB9, #161829);
            z-index: 9000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .admin-logo-img {
            height: 50px;
            width: auto;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .login-field {
            margin-bottom: 20px;
        }

        .login-field label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .login-field input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--bg);
        }

        .login-error {
            color: var(--red);
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            min-height: 1.2em;
        }

        body.not-auth header, body.not-auth .layout {
            display: none;
        }
        body.auth #login-screen {
            display: none;
        }
    </style>
</head>

<body class="not-auth">

    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <img src="assets/hdlogo.png" alt="AutoBidder Logo" class="admin-logo-img">
                <p style="color: var(--muted); font-size: 13px; margin-top: 10px;">Control Panel Authentication</p>
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="login-field">
                    <label>Admin Email</label>
                    <input type="email" id="login-email" placeholder="admin@autobidder.in" required>
                </div>
                <div class="login-field">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <div id="login-err" class="login-error"></div>
                <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 14px;" type="submit" id="login-btn">
                    Authorize Access
                </button>
            </form>
        </div>
    </div>

    <header class="glass">
        <a class="logo" href="#">
            <img src="assets/hdlogo.png" alt="AutoBidder Logo" class="admin-header-logo">
        </a>

        <div class="header-search">
            <i>🔍</i>
            <input type="text" placeholder="Global search users, cars, auctions..." id="globalSearch">
        </div>

        <div class="header-right">
            <div class="api-config">
                <div class="status-dot" id="status-indicator"></div>
                <input id="apiBase" type="text" placeholder="API Base URL">
                <button onclick="reconnect()" style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:10px; font-weight:800;">SYNC</button>
            </div>
            <div style="width:1px; height:24px; background:var(--border)"></div>
            <div style="display:flex; align-items:center; gap:10px">
                <div style="text-align:right">
                    <div style="font-size:13px; font-weight:700">Administrator</div>
                    <div style="font-size:11px; color:var(--muted)">super-admin</div>
                </div>
                <div class="avatar">AD</div>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside id="sidebar">
            <div class="sidebar-group">
                <div class="sidebar-label">Overview</div>
                <button class="nav-item active" data-mod="dashboard" onclick="nav('dashboard')">
                    <span class="icon"><i class="fa-solid fa-chart-line"></i></span> <span>Dashboard</span>
                </button>
                <button class="nav-item" data-mod="analytics" onclick="nav('analytics')">
                    <span class="icon"><i class="fa-solid fa-chart-pie"></i></span> <span>Revenue Analytics</span>
                </button>
            </div>

            <div class="sidebar-group">
                <div class="sidebar-label">Management</div>
                <button class="nav-item" data-mod="users" onclick="nav('users')">
                    <span class="icon"><i class="fa-solid fa-users"></i></span> <span>User Directory</span>
                </button>
                <button class="nav-item" data-mod="dealers" onclick="nav('dealers')">
                    <span class="icon"><i class="fa-solid fa-building"></i></span> <span>Dealer Network</span>
                </button>
                <button class="nav-item" data-mod="brands" onclick="nav('brands')">
                    <span class="icon"><i class="fa-solid fa-tag"></i></span> <span>Brand Network</span>
                </button>
                <button class="nav-item" data-mod="bids" onclick="nav('bids')">
                    <span class="icon"><i class="fa-solid fa-hand-holding-dollar"></i></span> <span>Buyer Records</span>
                </button>
                <button class="nav-item" data-mod="sellers" onclick="nav('sellers')">
                    <span class="icon"><i class="fa-solid fa-user-check"></i></span> <span>Seller Verification</span>
                </button>
                <button class="nav-item" data-mod="vehicles" onclick="nav('vehicles')">
                    <span class="icon"><i class="fa-solid fa-car-side"></i></span> <span>Vehicle Inspection</span>
                </button>
            </div>

            <div class="sidebar-group">
                <div class="sidebar-label">Operations</div>
                <button class="nav-item" data-mod="auctions" onclick="nav('auctions')">
                    <span class="icon"><i class="fa-solid fa-gavel"></i></span> <span>Auction Center</span>
                </button>
                <button class="nav-item" data-mod="appointments" onclick="nav('appointments')">
                    <span class="icon"><i class="fa-solid fa-calendar-check"></i></span> <span>Appointments</span>
                </button>
                <button class="nav-item" data-mod="rtonoc" onclick="nav('rtonoc')">
                    <span class="icon"><i class="fa-solid fa-file-contract"></i></span> <span>RTO & NOC</span>
                </button>
                <button class="nav-item" data-mod="leads" onclick="nav('leads')">
                    <span class="icon"><i class="fa-solid fa-bullseye"></i></span> <span>Leads & Inquiries</span>
                </button>
                <button class="nav-item" data-mod="autobid" onclick="nav('autobid')">
                    <span class="icon"><i class="fa-solid fa-robot"></i></span> <span>Auto-Bid Monitor</span>
                </button>
                <button class="nav-item" data-mod="delivery" onclick="nav('delivery')">
                    <span class="icon"><i class="fa-solid fa-truck-fast"></i></span> <span>Delivery Tracking</span>
                </button>
                <button class="nav-item" data-mod="payments" onclick="nav('payments')">
                    <span class="icon"><i class="fa-solid fa-credit-card"></i></span> <span>Payments & Escrow</span>
                </button>
                <button class="nav-item" data-mod="commissions" onclick="nav('commissions')">
                    <span class="icon"><i class="fa-solid fa-coins"></i></span> <span>Dealer Commissions</span>
                </button>
                <button class="nav-item" data-mod="fraud" onclick="nav('fraud')">
                    <span class="icon"><i class="fa-solid fa-shield-halved"></i></span> <span>Fraud Detection</span>
                </button>
                <button class="nav-item" data-mod="sliders" onclick="nav('sliders')">
                    <span class="icon"><i class="fa-solid fa-images"></i></span> <span>Sliders & Banners</span>
                </button>
            </div>

            <div class="sidebar-group">
                <div class="sidebar-label">System</div>
                <button class="nav-item" data-mod="notifications" onclick="nav('notifications')">
                    <span class="icon"><i class="fa-solid fa-bell"></i></span> <span>Notifications</span>
                </button>
                <button class="nav-item" data-mod="logs" onclick="nav('logs')">
                    <span class="icon"><i class="fa-solid fa-clipboard-list"></i></span> <span>Audit Logs</span>
                </button>
                <button class="nav-item" data-mod="pushtokens" onclick="nav('pushtokens')">
                    <span class="icon"><i class="fa-solid fa-mobile-screen-button"></i></span> <span>Push Tokens</span>
                </button>
            </div>

            <div style="margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1)">
                <button class="nav-item" onclick="logout()" style="color:var(--red); opacity:1">
                    <span class="icon"><i class="fa-solid fa-right-from-bracket"></i></span> <span>Logout</span>
                </button>
            </div>
        </aside>

        <main id="main">
            <div id="content" class="animate-fade">
                <!-- Content injected here -->
            </div>
        </main>

    <script src="app.js"></script>
    <script>
        // ───────────────────────────────────────────────
        // APP STATE & CONFIG
        // ───────────────────────────────────────────────
        let activeModule = 'dashboard';
        const root = document.getElementById('content');
        const indicator = document.getElementById('status-indicator');

        function updateAuthState() {
            const isAuth = !!adminApp.token;
            document.body.className = isAuth ? 'auth' : 'not-auth';
            if (isAuth && activeModule === 'dashboard') {
                reconnect();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const err = document.getElementById('login-err');
            const btn = document.getElementById('login-btn');

            err.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Authenticating...';

            try {
                await adminApp.login(email, password);
                updateAuthState();
            } catch (e) {
                err.textContent = e.message;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Authorize Access';
            }
        }

        function logout() {
            adminApp.logout();
            updateAuthState();
        }

        async function reconnect() {
            if (!adminApp.token) {
                updateAuthState();
                return;
            }
            showToast('🔄 Synchronizing with backend...', 'info');
            try {
                const data = await adminApp.getDashboardStats();
                indicator.className = 'status-dot online';
                showToast('✅ Backend Connected', 'success');
                loadModule(activeModule);
            } catch (e) {
                indicator.className = 'status-dot offline';
                if (e.message.includes('401') || e.message.includes('Unauthorized')) {
                    adminApp.token = null;
                    updateAuthState();
                } else {
                    showToast('❌ Connection Failed', 'error');
                }
            }
        }

        // ───────────────────────────────────────────────
        // NAVIGATION
        // ───────────────────────────────────────────────
        function nav(mod) {
            activeModule = mod;
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.mod === mod);
            });
            loadModule(mod);
        }

        function loadModule(mod) {

                <div class="loader"></div>
                <p style="margin-top:20px; color:var(--muted)">Fetching ${mod} data...</p>
            </div>`;

            const handlers = {
                dashboard: renderDashboard,
                users: renderUsers,
                dealers: renderDealers,
                sellers: renderSellers,
                vehicles: renderVehicles,
                auctions: renderAuctions,
                analytics: renderAnalytics,
                fraud: renderFraud,
                payments: renderPayments,
                commissions: renderCommissions,
                logs: renderLogs,
                notifications: renderNotifications,
                sliders: renderSliders,
                brands: renderBrands,
                bids: renderBids,
                delivery: renderDelivery,
                autobid: renderAutoBids,
                leads: renderLeads,
                payouts: renderPayouts,
                appointments: renderAppointments,
                rtonoc: renderRtoNoc,
                pushtokens: renderPushTokens

            (handlers[mod] || renderDashboard)();
        }

        async function moveSlider(id, direction) {
            try {
                const data = await adminApp.getSliders();
                const sliders = data.sliders || [];
                const idx = sliders.findIndex(s => s.id === id);
                if (idx === -1) return;

                const otherIdx = direction === 'up' ? idx - 1 : idx + 1;
                if (otherIdx < 0 || otherIdx >= sliders.length) return;

                const current = sliders[idx];
                const other = sliders[otherIdx];

                // Swap orders
                const tempOrder = current.order;
                await adminApp.updateSlider(current.id, { order: other.order });
                await adminApp.updateSlider(other.id, { order: tempOrder });

                showToast('Order updated', 'success');
                renderSliders();
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function moveBrand(id, direction) {
            try {
                const data = await adminApp.getBrands();
                const brands = data.brands || [];
                const idx = brands.findIndex(b => b.id === id);
                if (idx === -1) return;
                const otherIdx = direction === 'up' ? idx - 1 : idx + 1;
                if (otherIdx < 0 || otherIdx >= brands.length) return;
                const current = brands[idx];
                const other = brands[otherIdx];
                const tempOrder = current.order;
                await adminApp.updateBrand(current.id, { order: other.order });
                await adminApp.updateBrand(other.id, { order: tempOrder });
                showToast('Order updated', 'success');
                renderBrands();
            } catch (e) { showToast(e.message, 'error'); }
        }

        function fmtINR(v) { return '₹' + Number(v).toLocaleString('en-IN'); }
        function fmtDate(v) { return new Date(v).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }); }
        function fmtTimeAgo(v) {
            const sec = Math.floor((new Date() - new Date(v)) / 1000);
            if(sec < 60) return 'just now';
            if(sec < 3600) return Math.floor(sec/60) + 'm ago';
            if(sec < 86400) return Math.floor(sec/3600) + 'h ago';
            return Math.floor(sec/86400) + 'd ago';
        }

            window._tTimer = setTimeout(() => {
                t.style.transform = 'translateX(-50%) translateY(100px)';
            }, 3000);
        }

        // ───────────────────────────────────────────────
        // DOCUMENT PREVIEW
        // ───────────────────────────────────────────────
        function documentKind(url) {
            if (!url) return 'none';
            const path = url.split('?')[0].toLowerCase();
            if (/\.(png|jpe?g|gif|webp|svg)$/.test(path)) return 'image';
            if (/\.pdf$/.test(path)) return 'pdf';
            return 'other';
        }

        function previewDocument(url, title = 'Document') {
            if (!url) return showToast('No document URL provided', 'error');

            const overlay = document.getElementById('preview-overlay');
            const content = document.getElementById('preview-content');
            const titleEl = document.getElementById('preview-title');
            const downloadLink = document.getElementById('preview-download');

            titleEl.textContent = title;
            downloadLink.href = url;

            const kind = documentKind(url);
            if (kind === 'image') {
                content.innerHTML = `<img src="${url}" alt="${title}">`;
            } else if (kind === 'pdf') {
                content.innerHTML = `<iframe src="${url}"></iframe>`;
            } else {
                content.innerHTML = `
                    <div style="text-align:center; color:white">
                        <i class="fa-solid fa-file-circle-question" style="font-size:60px; margin-bottom:20px"></i>
                        <h3>Cannot preview this file type</h3>
                        <p>Use the 'Open Original' button to download or view it.</p>
                    </div>`;
            }

            overlay.classList.add('open');
        }

        function closePreview(e) {
            if (e && e.target !== document.getElementById('preview-overlay') && e.type !== 'click') return;
            document.getElementById('preview-overlay').classList.remove('open');
            document.getElementById('preview-content').innerHTML = '';
        }

            return `<button class="btn btn-secondary" style="padding:4px 8px; font-size:10px" onclick="previewDocument('${url}', '${title}')"><i class="fa-solid fa-eye"></i> View</button>`;

                        <label class="detail-label">Full Address</label>
                        <textarea id="add-dealer-address" class="btn-secondary" style="width:100%; text-align:left; padding:10px; min-height:80px; resize:none" placeholder="123 Business Park..."></textarea>
                    </div>
                </div>
            `;

            const actions = `
                <button class="btn btn-secondary" style="flex:1" onclick="closeDetail()">Cancel</button>
                <button class="btn btn-primary" style="flex:1" onclick="submitAddDealer()">Create Dealer</button>
            `;

            openDetail('Register New Dealer', html, actions);
        }

        async function submitAddDealer() {
            const data = {
                showroomName: document.getElementById('add-dealer-showroom').value,
                name: document.getElementById('add-dealer-name').value,
                email: document.getElementById('add-dealer-email').value,
                phone: document.getElementById('add-dealer-phone').value,
                city: document.getElementById('add-dealer-city').value,
                address: document.getElementById('add-dealer-address').value,
            };

            if (!data.showroomName || !data.email) return showToast('Please fill required fields', 'error');

            showToast('Registering dealer...', 'info');
            try {
                await adminApp.createDealer(data);
                showToast('Dealer registered successfully', 'success');
                closeDetail();
                renderDealers();
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function deleteUser(id) {
            if (!confirm('Are you sure you want to delete this user? This action cannot be undone.')) return;
            try {
                await adminApp.deleteUser(id);
                showToast('User deleted successfully', 'success');
                renderUsers();
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function deleteDealer(id) {
            if (!confirm('Are you sure you want to delete this dealer?')) return;
            try {
                await adminApp.deleteDealer(id);
                showToast('Dealer deleted successfully', 'success');
                renderDealers();
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function deleteListing(id) {
            if (!confirm('Are you sure you want to delete this listing?')) return;
            try {
                await adminApp.deleteListing(id);
                showToast('Listing deleted successfully', 'success');
                loadModule(activeModule);
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function showDealerDetails(id) {
            try {
                const dealers = (await adminApp.getDealers()).dealers;
                const d = dealers.find(x => x.id === id);
                if (!d) return;

                const html = `
                    <div style="display:flex; align-items:center; gap:20px; margin-bottom:24px">
                        <div class="avatar" style="width:60px; height:60px; font-size:24px; background:var(--accent); color:white">${(d.showroomName || d.name || 'D')[0]}</div>
                        <div>
                            <h3 style="font-size:20px">${d.showroomName || d.name}</h3>
                            <div style="color:var(--muted); font-size:13px">${d.email} • ${d.city}</div>
                        </div>
                    </div>

                    <div class="detail-label">Business Details</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px">
                        <div style="background:var(--bg); padding:16px; border-radius:12px; border:1px solid var(--border)">
                            <div class="detail-label">Status</div>
                            <div style="margin-top:4px">${badge(d.status || 'VERIFIED', d.status === 'PENDING' ? 'yellow' : 'green')}</div>
                        </div>
                        <div style="background:var(--bg); padding:16px; border-radius:12px; border:1px solid var(--border)">
                            <div class="detail-label">Featured</div>
                            <div style="margin-top:4px">${d.isFeatured ? badge('Premium', 'blue') : badge('Standard', 'gray')}</div>
                        </div>
                    </div>

                    <div class="detail-label">Contact Information</div>
                    <div style="margin-bottom:24px">
                        <div style="font-size:14px; margin-bottom:4px"><b>Owner:</b> ${d.name}</div>
                        <div style="font-size:14px; margin-bottom:4px"><b>Phone:</b> ${d.phone || 'N/A'}</div>
                        <div style="font-size:14px"><b>Address:</b> ${d.address || 'N/A'}</div>
                    </div>

                    <div class="detail-label">Performance Metrics</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px">
                        <div style="background:var(--bg); padding:16px; border-radius:12px; border:1px solid var(--border); text-align:center">
                            <div style="font-size:24px; font-weight:800">${d._count?.listings || 0}</div>
                            <div class="detail-label" style="margin-bottom:0">Active Cars</div>
                        </div>
                        <div style="background:var(--bg); padding:16px; border-radius:12px; border:1px solid var(--border); text-align:center">
                            <div style="font-size:24px; font-weight:800">${d._count?.soldListings || 0}</div>
                            <div class="detail-label" style="margin-bottom:0">Total Sold</div>
                        </div>
                    </div>
                `;

                const actions = `
                    <button class="btn btn-secondary" style="flex:1" onclick="closeDetail()">Close</button>
                    <button class="btn btn-primary" onclick="showToast('Edit Dealer Modal coming soon', 'info')">Edit Details</button>
                `;

                openDetail('Dealer Management', html, actions);
            } catch (e) { console.error(e); }
        }

        async function showLeadDetails(id) {
            try {
                const leads = (await adminApp.getLeads()).leads;
                const l = leads.find(x => x.id === id);
                if (!l) return;

                const html = `
                    <div style="margin-bottom:24px">
                        <h3 style="font-size:18px">Inquiry from ${l.userName}</h3>
                        <p style="color:var(--muted); font-size:14px">Regarding ${l.listingTitle}</p>
                    </div>

                    <div style="background:var(--bg); padding:20px; border-radius:12px; border:1px solid var(--border); margin-bottom:24px">
                        <div class="detail-label">Lead Information</div>
                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px">
                            <div>
                                <div style="font-size:11px; color:var(--muted)">Phone</div>
                                <div style="font-weight:700">${l.phone}</div>
                            </div>
                            <div>
                                <div style="font-size:11px; color:var(--muted)">Source</div>
                                <div>${badge(l.source || 'WEB', 'blue')}</div>
                            </div>
                            <div>
                                <div style="font-size:11px; color:var(--muted)">Status</div>
                                <div>${badge(l.status, l.status === 'NEW' ? 'yellow' : 'green')}</div>
                            </div>
                            <div>
                                <div style="font-size:11px; color:var(--muted)">Assigned Dealer</div>
                                <div style="font-weight:600">${l.dealerName || 'Direct'}</div>
                            </div>
                        </div>
                    </div>

                    <div class="detail-label">Message / Notes</div>
                    <div style="background:white; padding:16px; border-radius:8px; border:1px solid var(--border); font-size:14px; line-height:1.5">
                        ${l.message || 'No additional message provided by the inquirer.'}
                    </div>
                `;

                const actions = `
                    <button class="btn btn-secondary" style="flex:1" onclick="closeDetail()">Close</button>
                    <button class="btn btn-primary" onclick="showToast('Lead status updated', 'success'); closeDetail(); renderLeads();">Mark as Processed</button>
                `;

                openDetail('Inquiry Details', html, actions);
            } catch (e) { console.error(e); }
        }

        function exportLogs() {
            showToast('Preparing log export...', 'info');
            setTimeout(() => {
                showToast('Audit logs exported to CSV', 'success');
            }, 1500);
        }

        async function showUserDetails(id) {
            try {
                const users = (await adminApp.getUsers()).users;
                const u = users.find(x => x.id === id);
                if(!u) return;

                const bidsData = await adminApp.getBids();
                const userBids = (bidsData.bids || []).filter(b => b.userId === id);

                const html = `
                    <div style="display:flex; align-items:center; gap:20px; margin-bottom:24px">
                        <div class="avatar" style="width:60px; height:60px; font-size:24px">${(u.name || 'U')[0].toUpperCase()}</div>
                        <div>
                            <h3 style="font-size:20px">${u.name || 'Anonymous'}</h3>
                            <div style="color:var(--muted); font-size:13px">${u.email} • ${u.phone || 'No phone'}</div>
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px">
                        <div style="background:var(--bg); padding:16px; border-radius:12px; border:1px solid var(--border)">
                            <div class="detail-label">Verification Status</div>
                            <div style="margin-top:4px">${u.isVerified ? badge('Verified Account', 'green') : badge('Unverified', 'yellow')}</div>
                        </div>
                        <div style="background:var(--bg); padding:16px; border-radius:12px; border:1px solid var(--border)">
                            <div class="detail-label">Member Since</div>
                            <div class="detail-value" style="margin-top:4px">${fmtDate(u.createdAt)}</div>
                        </div>
                    </div>

                    <div class="detail-label" style="margin-bottom:12px">Bidding History (${userBids.length})</div>
                    <div style="display:flex; flex-direction:column; gap:8px">
                        ${userBids.map(b => `
                            <div style="background:rgba(0,0,0,0.02); padding:12px; border-radius:10px; border:1px solid var(--border); display:flex; justify-content:space-between; align-items:center">
                                <div>
                                    <div style="font-size:13px; font-weight:700">${b.listing?.title || 'Unknown Vehicle'}</div>
                                    <div style="font-size:11px; color:var(--muted)">${fmtDate(b.createdAt)}</div>
                                </div>
                                <div style="text-align:right">
                                    <div style="font-size:14px; font-weight:800; color:var(--green)">${fmtINR(b.amount)}</div>
                                    <div style="font-size:10px">${badge(b.status || 'ACTIVE', b.status === 'WON' ? 'green' : 'blue')}</div>
                                </div>
                            </div>
                        `).join('') || '<div style="padding:20px; text-align:center; color:var(--muted); font-size:13px">No bids found for this user.</div>'}
                    </div>

                    <div class="detail-label" style="margin-top:24px; margin-bottom:12px">Listings Managed</div>
                    <div style="font-size:13px; color:var(--muted)">
                        User has created <b>${u._count?.listings || 0}</b> listings on the platform.
                    </div>
                `;

                const actions = `
                    <button class="btn btn-secondary" style="flex:1" onclick="closeDetail()">Close</button>
                    <button class="btn btn-danger" onclick="blockUser('${u.id}')">Suspend User</button>
                `;

                openDetail('User Profile & Buyer Record', html, actions);
            } catch(e) { console.error(e); }
        }

        async function showListingDetails(id) {
            try {
                const listings = (await adminApp.getListings()).listings;
                const l = listings.find(x => x.id === id);
                if(!l) return;

                const html = `
                    <div style="background:var(--bg); border-radius:12px; overflow:hidden; margin-bottom:24px; position:relative">
                        ${l.imageUrl ? `
                            <img src="${l.imageUrl}" style="width:100%; height:220px; object-fit:cover; display:block">
                        ` : `
                            <div style="height:220px; background:var(--bg); display:grid; place-items:center; color:var(--muted)">
                                <div style="text-align:center">
                                    <div style="font-size:40px">🖼️</div>
                                    <div style="font-size:12px; margin-top:8px">No image available</div>
                                </div>
                            </div>
                        `}
                        <div style="position:absolute; bottom:12px; right:12px; background:rgba(0,0,0,0.6); padding:4px 10px; border-radius:6px; font-size:10px; color:white">
                            AI Confidence: 94%
                        </div>
                    </div>

                    <div style=\"background:rgba(59, 130, 246, 0.05); border:1px solid var(--accent); padding:16px; border-radius:12px; margin-bottom:24px\">
                        <div style=\"display:flex; justify-content:space-between; align-items:center\">
                            <div style=\"display:flex; align-items:center; gap:12px\">
                                <div style=\"width:40px; height:40px; background:white; border-radius:8px; border:1px solid var(--border); padding:5px\">
                                    <img src=\"${getBrandLogo(l.brand)}\" style=\"width:100%; height:100%; object-fit:contain\">
                                </div>
                                <div>
                                    <div class=\"detail-label\" style=\"color:var(--accent); margin-bottom:0\">AI Price Recommendation</div>
                                    <div style=\"font-size:18px; font-weight:800; color:var(--text)\">${fmtINR(l.demandPrice * 0.95)} — ${fmtINR(l.demandPrice * 1.05)}</div>
                                </div>
                            </div>
                            <div style=\"text-align:right\">
                                <div class=\"badge badge-blue\">Recommended</div>
                            </div>
                        </div>
                    </div>

                    <div class="sidebar-label" style="padding-left:0; margin-bottom:12px">Vehicle Specifications</div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px">
                        <div class="detail-row"><div class="detail-label">Brand & Model</div><div class="detail-value">${l.brand} ${l.model}</div></div>
                        <div class="detail-row"><div class="detail-label">Year</div><div class="detail-value">${l.manufacturingYear}</div></div>
                        <div class="detail-row"><div class="detail-label">Fuel & Gearbox</div><div class="detail-value">${l.fuelType} • ${l.transmission}</div></div>
                        <div class="detail-row"><div class="detail-label">Kms Driven</div><div class="detail-value">${l.kmsDriven || '42,000'} km</div></div>
                    </div>

                    <div class="sidebar-label" style="padding-left:0; margin-bottom:12px">Document Verification</div>
                    <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:24px">
                        <div style="background:var(--bg); padding:12px; border-radius:10px; border:1px solid var(--border); display:flex; justify-content:space-between; align-items:center">
                            <span style="font-size:13px">Registration Certificate (RC)</span>
                            <div style="display:flex; align-items:center; gap:10px">
                                ${l.rcImages?.length ? docButton(l.rcImages[0], 'RC Certificate') : '<span style="color:var(--muted); font-size:11px">Missing</span>'}
                                <span style="color:var(--green); font-weight:700; font-size:11px">VALID ✓</span>
                            </div>
                        </div>
                        <div style="background:var(--bg); padding:12px; border-radius:10px; border:1px solid var(--border); display:flex; justify-content:space-between; align-items:center">
                            <span style="font-size:13px">Insurance Policy</span>
                            <div style="display:flex; align-items:center; gap:10px">
                                ${l.images?.length > 1 ? docButton(l.images[1], 'Insurance Doc') : '<span style="color:var(--muted); font-size:11px">Missing</span>'}
                                <span style="color:var(--yellow); font-weight:700; font-size:11px">ACTIVE</span>
                            </div>
                        </div>
                        <div style="background:var(--bg); padding:12px; border-radius:10px; border:1px solid var(--border); display:flex; justify-content:space-between; align-items:center">
                            <span style="font-size:13px">Bank NOC</span>
                            <div style="display:flex; align-items:center; gap:10px">
                                ${l.bankNocImages?.length ? docButton(l.bankNocImages[0], 'Bank NOC') : '<span style="color:var(--muted); font-size:11px">N/A</span>'}
                            </div>
                        </div>
                    </div>

                    <div class="sidebar-label" style="padding-left:0; margin-bottom:12px">Expert Inspection</div>
                    <div style="background:var(--card-hover); padding:16px; border-radius:12px; border:1px dashed var(--border); text-align:center">
                        <div style="font-size:24px; margin-bottom:8px">📋</div>
                        <div style="font-weight:700; font-size:14px">Full Inspection Report</div>
                        <div style="font-size:11px; color:var(--muted); margin-bottom:12px">140+ Points Checked by AutoBidder Team</div>
                        <div id="inspection-report-btn">
                            ${l.inspectionReportUrl ? docButton(l.inspectionReportUrl, 'Expert Inspection Report') : '<span style="color:var(--muted); font-size:11px">Report Pending</span>'}
                        </div>
                    </div>

                    <hr style="border:none; border-top:1px solid var(--border); margin:24px 0">
                    <div class="detail-row">
                        <div class="detail-label">Listed by Seller</div>
                        <div class="detail-value" style="display:flex; align-items:center; gap:10px">
                            <div class="avatar" style="width:24px; height:24px; font-size:10px">${(l.seller?.name || 'S')[0]}</div>
                            ${l.seller?.name} (${l.seller?.phone})
                        </div>
                    </div>
                `;

                const actions = `
                    <button class="btn btn-primary" style="flex:1" onclick="updateListing('${l.id}', 'ACTIVE')">Approve & Go Live</button>
                    <button class="btn btn-danger" onclick="updateListing('${l.id}', 'REJECTED')">Reject Listing</button>
                `;

                openDetail('Vehicle Audit & Verification', html, actions);
            } catch(e) {}
        }

        async function verifySeller(id, approved) {
            try {
                await adminApp.verifyUser(id, approved);
                showToast(approved ? 'Seller Verified' : 'Seller Rejected', 'success');
                renderSellers();
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function updateListing(id, status) {
            try {
                await adminApp.updateListingStatus(id, status);
                showToast(`Listing ${status}`, 'success');
                closeDetail();
                loadModule(activeModule);
            } catch (e) { showToast(e.message, 'error'); }
        }

        function renderError(e) {
            root.innerHTML = `<div style="padding:100px; text-align:center">
                <div style="font-size:60px">🔌</div>
                <h2 style="margin:20px 0">Connection Error</h2>
                <p style="color:var(--muted)">Unable to reach the backend at <b>${adminApp.apiBase}</b></p>
                <p style="font-size:12px; margin-top:10px">${e.message}</p>
                <button class="btn btn-primary" style="margin-top:30px" onclick="reconnect()">Try Reconnecting</button>
            </div>`;
        }

        // ───────────────────────────────────────────────
        // BOOT
        // ───────────────────────────────────────────────
        updateAuthState();
        nav('dashboard');

    </script>
</body>

</html>
