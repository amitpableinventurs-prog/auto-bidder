name: Android APK - Build + Crash Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build and Test Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Expo Doctor
        working-directory: apps/mobile
        run: npx expo-doctor
        continue-on-error: true

      - name: Expo Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --clean

      - name: Configure Gradle
        working-directory: apps/mobile/android
        shell: bash
        run: |
          sed -i '/^android\.enableR8=/d' gradle.properties
          sed -i '/^newArchEnabled=/d' gradle.properties

          cat >> gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Gradle Clean
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew clean --no-daemon --max-workers=2

      - name: Build Release APK
        working-directory: apps/mobile/android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      - name: Verify APK
        working-directory: apps/mobile
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-bidder-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Install Android Emulator
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "system-images;android-35;google_apis;x86_64"

          yes | sdkmanager --licenses || true

      - name: Create Android Emulator
        run: |
          echo "no" | avdmanager create avd \
            -n test-emulator \
            -k "system-images;android-35;google_apis;x86_64" \
            --force

      - name: Start Android Emulator
        run: |
          nohup emulator \
            -avd test-emulator \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > emulator.log 2>&1 &

          adb wait-for-device

          timeout 300 bash -c '
            until adb shell getprop sys.boot_completed | grep -m 1 "1"; do
              sleep 5
            done
          '

          adb shell input keyevent 82

      - name: Install Release APK
        run: |
          adb install -r \
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Verify Installed Package
        run: |
          adb shell pm list packages | grep "com.monicinfosys.autobidder"

      - name: Launch Auto Bidder
        run: |
          adb shell monkey \
            -p com.monicinfosys.autobidder \
            -c android.intent.category.LAUNCHER \
            1

          sleep 20

      - name: Capture Logcat
        if: always()
        run: |
          mkdir -p crash-logs

          adb logcat -d -v time \
            > crash-logs/logcat-full.txt

          adb logcat -d -v time "*:E" \
            > crash-logs/logcat-errors.txt || true

          adb shell dumpsys activity activities \
            > crash-logs/activity.txt || true

          adb shell dumpsys package com.monicinfosys.autobidder \
            > crash-logs/package.txt || true

      - name: Detect Application Crash
        if: always()
        shell: bash
        run: |
          LOG="crash-logs/logcat-full.txt"

          echo "Checking for Android crashes..."

          if grep -Eiq \
            "FATAL EXCEPTION|FATAL SIGNAL|SIGSEGV|SIGABRT|AndroidRuntime: FATAL|Process .* has died|Fatal signal" \
            "$LOG"; then

            echo "======================================"
            echo "APPLICATION CRASH DETECTED"
            echo "======================================"

            grep -Ein \
              "FATAL EXCEPTION|FATAL SIGNAL|SIGSEGV|SIGABRT|AndroidRuntime: FATAL|Process .* has died|Fatal signal" \
              "$LOG" \
              | tail -100

            exit 1
          fi

          echo "No fatal Android crash detected."

      - name: Upload Crash Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-crash-logs
          path: |
            crash-logs/
            emulator.log
          if-no-files-found: warn

      - name: Final Test Result
        run: |
          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "APK INSTALL SUCCESSFUL"
          echo "APP STARTUP TEST COMPLETED"
          echo "NO FATAL CRASH DETECTED"
          echo "======================================"
