name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root packages
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Environment File
        run: |
          cat > apps/mobile/.env <<EOF
          EXPO_PUBLIC_API_BASE_URL=https://api.autobidder.in
          EXPO_PUBLIC_SOCKET_URL=https://api.autobidder.in
          EOF

          echo "Production environment configured."

      - name: Build Release APK
        working-directory: apps/mobile
        run: |
          echo "Installing mobile dependencies..."
          npm install

          echo "Generating Android project..."
          npx expo prebuild --clean

          cd android

          echo "Configuring Gradle memory..."

          cat >> gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=4096m
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          kotlin.daemon.jvm.options=-Xmx4096m
          EOF

          chmod +x gradlew

          echo "Cleaning Gradle..."
          ./gradlew clean --no-daemon --max-workers=1

          echo "Building Release APK..."
          ./gradlew assembleRelease \
            -x lintVitalAnalyzeRelease \
            --no-daemon \
            --max-workers=1

          echo "Gradle build completed successfully."

      - name: Verify APK
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"

          echo "Checking APK..."

          if [ ! -f "$APK" ]; then
            echo "APK NOT FOUND"
            exit 1
          fi

          echo "APK created successfully."
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Bidder-Release-APK
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Build Complete
        run: |
          echo "=========================================="
          echo "AUTO BIdDER APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo "APK: app-release.apk"
          echo "=========================================="
```
