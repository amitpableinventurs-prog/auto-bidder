name: Android APK Build + Crash Test

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build-and-crash-test:
runs-on: ubuntu-latest
timeout-minutes: 60

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22
      cache: npm

  - name: Install dependencies
    run: npm ci

  - name: Run Expo Doctor
    run: npx expo-doctor

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"
      cache: gradle

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Accept Android licenses
    run: yes | sdkmanager --licenses || true

  - name: Generate Android project
    run: npx expo prebuild --platform android --clean

  - name: Configure Gradle
    working-directory: android
    shell: bash
    run: |
      cat >> gradle.properties <<'EOF'
      org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
      org.gradle.daemon=false
      org.gradle.parallel=false
      org.gradle.workers.max=2
      EOF

  - name: Make Gradle executable
    working-directory: android
    run: chmod +x gradlew

  - name: Clean Android
    working-directory: android
    run: ./gradlew clean --no-daemon

  - name: Build Release APK
    working-directory: android
    run: ./gradlew assembleRelease --no-daemon --max-workers=2

  - name: Verify APK
    shell: bash
    run: |
      APK="android/app/build/outputs/apk/release/app-release.apk"

      if [ ! -f "$APK" ]; then
        echo "APK NOT FOUND"
        exit 1
      fi

      SIZE=$(stat -c%s "$APK")
      echo "APK size: $SIZE bytes"

      if [ "$SIZE" -lt 1000000 ]; then
        echo "APK size suspiciously small"
        exit 1
      fi

      echo "APK generated successfully"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: auto-bidder-release-apk
      path: android/app/build/outputs/apk/release/app-release.apk
      retention-days: 7

  - name: Install Android Emulator
    run: |
      sdkmanager "platform-tools"
      sdkmanager "emulator"
      sdkmanager "platforms;android-35"
      sdkmanager "system-images;android-35;google_apis;x86_64"

  - name: Create Android Emulator
    run: |
      echo "no" | avdmanager create avd \
        -n auto-bidder-test \
        -k "system-images;android-35;google_apis;x86_64" \
        --force

  - name: Start Android Emulator
    shell: bash
    run: |
      nohup emulator \
        -avd auto-bidder-test \
        -no-window \
        -no-audio \
        -no-boot-anim \
        -no-snapshot \
        -gpu swiftshader_indirect \
        > emulator.log 2>&1 &

      adb wait-for-device

      for i in {1..60}; do
        BOOT=$(adb shell getprop sys.boot_completed | tr -d '\r')
        if [ "$BOOT" = "1" ]; then
          break
        fi
        sleep 2
      done

      if [ "$BOOT" != "1" ]; then
        echo "Emulator failed to boot"
        cat emulator.log
        exit 1
      fi

  - name: Clear Logcat
    run: adb logcat -c

  - name: Install APK
    run: adb install -r android/app/build/outputs/apk/release/app-release.apk

  - name: Launch App
    run: |
      adb shell monkey \
        -p in.autobidder.app \
        -c android.intent.category.LAUNCHER \
        1

      sleep 40

  - name: Collect Logs
    if: always()
    run: adb logcat -d > crash-log.txt

  - name: Detect Crash
    shell: bash
    run: |
      PATTERN="FATAL EXCEPTION|AndroidRuntime.*FATAL|UnsatisfiedLinkError|ClassNotFoundException|NoSuchMethodError|NoClassDefFoundError"

      if grep -Eiq "$PATTERN" crash-log.txt; then
        echo "STARTUP CRASH DETECTED"
        grep -Ei -A 50 -B 15 "$PATTERN|AndroidRuntime" crash-log.txt || true
        exit 1
      fi

      PID=$(adb shell pidof in.autobidder.app || true)

      if [ -z "$PID" ]; then
        echo "APP PROCESS NOT RUNNING"
        exit 1
      fi

      echo "NO STARTUP CRASH DETECTED"
      echo "APP PROCESS IS RUNNING"

  - name: Upload Crash Logs
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: auto-bidder-crash-logs
      path: |
        crash-log.txt
        emulator.log
      retention-days: 14
