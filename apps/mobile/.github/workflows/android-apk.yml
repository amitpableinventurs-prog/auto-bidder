name: Android Release Build

on:
  push:
    tags:
      - 'v*'          # tag banao jaise v1.0.0 taaki release build trigger ho
  workflow_dispatch: {} # manual "Run workflow" button se bhi chala sakte ho

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_SOCKET_URL: ${{ secrets.EXPO_PUBLIC_SOCKET_URL }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK (matches project's ndk version)
        run: sdkmanager --install "ndk;27.1.12297006"

      - name: Install dependencies (clean, reproducible)
        run: npm ci

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ---- Signing keystore setup ----
      # 1. Locally generate a keystore once (if you don't have one):
      #    keytool -genkeypair -v -storetype PKCS12 -keystore release.keystore \
      #      -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000
      # 2. Convert it to base64:
      #    base64 -w 0 release.keystore > release.keystore.base64.txt   (Linux/Mac)
      #    certutil -encode release.keystore release.keystore.base64.txt   (Windows, then strip header/footer lines)
      # 3. Paste that base64 text into a GitHub secret called ANDROID_KEYSTORE_BASE64
      # 4. Add secrets: ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        working-directory: android
        env:
          MYAPP_RELEASE_STORE_FILE: release.keystore
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
