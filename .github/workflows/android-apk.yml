```yaml
name: Build Auto Bidder Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Memory configuration for Node + Gradle
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      GRADLE_OPTS: >-
        -Xmx6144m
        -XX:MaxMetaspaceSize=1024m
        -Dfile.encoding=UTF-8

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # --------------------------------------------------
      # 4. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # --------------------------------------------------
      # 5. Check Environment
      # --------------------------------------------------
      - name: Check Build Environment
        run: |
          echo "======================================"
          echo "NODE"
          echo "======================================"
          node --version
          npm --version

          echo "======================================"
          echo "JAVA"
          echo "======================================"
          java -version

          echo "======================================"
          echo "MEMORY"
          echo "======================================"
          free -h

          echo "======================================"
          echo "CPU"
          echo "======================================"
          nproc

      # --------------------------------------------------
      # 6. Install Dependencies
      # --------------------------------------------------
      - name: Install Dependencies
        run: |
          npm ci --no-audit --no-fund

      # --------------------------------------------------
      # 7. Verify Expo
      # --------------------------------------------------
      - name: Verify Expo
        run: |
          npx expo --version
          node -e "console.log('Node process OK')"

      # --------------------------------------------------
      # 8. Generate Android Project
      # --------------------------------------------------
      - name: Generate Android Project
        run: |
          npx expo prebuild \
            --platform android \
            --no-install

      # --------------------------------------------------
      # 9. Configure Gradle Memory
      # --------------------------------------------------
      - name: Configure Gradle
        run: |
          cat >> android/gradle.properties <<'EOF'

          # ==========================================
          # GitHub Actions CI Configuration
          # ==========================================

          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

          org.gradle.daemon=false

          org.gradle.parallel=false

          org.gradle.workers.max=2

          org.gradle.caching=true

          android.useAndroidX=true

          android.enableJetifier=true
          EOF

          echo "===== gradle.properties ====="
          cat android/gradle.properties

      # --------------------------------------------------
      # 10. Make Gradle Executable
      # --------------------------------------------------
      - name: Make Gradle Executable
        run: |
          chmod +x android/gradlew

      # --------------------------------------------------
      # 11. Verify Gradle
      # --------------------------------------------------
      - name: Verify Gradle
        working-directory: android
        run: |
          ./gradlew --version

      # --------------------------------------------------
      # 12. Clean Build
      # --------------------------------------------------
      - name: Clean Android Build
        working-directory: android
        run: |
          ./gradlew clean \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

      # --------------------------------------------------
      # 13. Build Release APK
      # --------------------------------------------------
      - name: Build Release APK
        working-directory: android
        run: |
          echo "======================================"
          echo "BUILDING RELEASE APK"
          echo "======================================"

          export NODE_OPTIONS="--max-old-space-size=4096"

          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            --stacktrace \
            --info

      # --------------------------------------------------
      # 14. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        run: |
          echo "======================================"
          echo "APK OUTPUT"
          echo "======================================"

          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          ls -lh "$APK"

      # --------------------------------------------------
      # 15. Upload APK
      # --------------------------------------------------
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-bidder-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------
      # 16. Upload Reports If Build Fails
      # --------------------------------------------------
      - name: Upload Gradle Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auto-bidder-build-reports
          path: |
            android/build/reports/**
            android/app/build/reports/**
            android/build/outputs/**
          if-no-files-found: ignore
          retention-days: 7
```
